# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            "

BBFILE_COLLECTIONS += "impcas-util"
BBFILE_PATTERN_impcas-util = "^${LAYERDIR}/"
BBFILE_PRIORITY_impcas-util = "4"

# User-environment and development-tool configuration shared across IMPCAS
# projects (editor configs, shell tooling). This is distinct from
# meta-impcas-site: site = per-machine provisioning from the BOOT partition,
# util = the same comfortable environment on every machine.

LAYERSERIES_COMPAT_impcas-util = "scarthgap"

LAYERDEPENDS_impcas-util = "core"

# meta-virtualization also ships an older yq; prefer ours when both layers
# are present.
PREFERRED_VERSION_yq = "v4.53.6"
